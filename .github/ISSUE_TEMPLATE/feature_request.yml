name: Feature request
description: An idea for the integration
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: German or English, both are fine.
  - type: textarea
    id: idea
    attributes:
      label: What do you want?
      description: The situation and your idea.
    validations:
      required: true
  - type: input
    id: vehicle
    attributes:
      label: Vehicle and source integration
      placeholder: Hyundai Ioniq 5 via Bluelink
